[tool.poetry]
name = "hire-lens-backend"
version = "0.1.0"
description = "Backend for Hire Lens Resume Checker (Agentic AI)"
authors = ["Your Name <you@example.com>"]

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
fastapi = ">=0.128.0"
uvicorn = ">=0.40.0"
python-dotenv = ">=1.2.1"
langchain = ">=1.2.3"
langgraph = ">=1.0.5"
langchain-openai = ">=1.1.7"
pdfplumber = ">=0.11.4"
python-docx = ">=1.1.2"
pydantic-settings = ">=2.10.1"
loguru = ">=0.7.3"
python-multipart = ">=0.0.21"
langchain-google-genai = ">=4.1.3"
sqlalchemy = ">=2.0.0"
psycopg2-binary = ">=2.9.0"
alembic = ">=1.13.0"
python-jose = {version = ">=3.3.0", extras = ["cryptography"]}
passlib = {version = ">=1.7.4", extras = ["bcrypt"]}
bcrypt = ">=4.0.0"
stripe = ">=7.0.0"
redis = ">=5.0.0"
celery = ">=5.3.0"
reportlab = ">=4.0.0"
httpx = ">=0.27.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

